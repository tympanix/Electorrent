electronLanguages:
  - en
directories:
  output: dist
  buildResources: build
toolsets:
  appimage: 1.0.3
productName: Electorrent
appId: com.github.tympanix.electorrent
files:
  - '!**/*.map'
mac:
  category: public.app-category.utilities
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSLocalNetworkUsageDescription: Electorrent connects to torrent clients running on devices on your local network.
  target:
    - target: dmg
      arch:
        - universal
        - arm64
win:
  target: squirrel
  publish:
    - github
dmg:
  publish:
    - github
pkg:
  publish:
    - github
linux:
  icon: build/png
  category: Network;FileTransfer;P2P;
  desktop:
    entry:
      MimeType: application/x-bittorrent;x-scheme-handler/magnet;
      Keywords: p2p;bittorrent;
  target:
    - snap
    - AppImage
    - deb
    - rpm
snap:
  publish:
    - github
appImage:
  publish:
    - github
deb:
  publish:
    - github
rpm:
  publish:
    - github
extraFiles:
  - filter:
      - resources
fileAssociations:
  - ext: torrent
    name: Bittorrent Document
    role: Viewer
    description: Torrent Files
afterPack: ./util/after-pack.js
afterAllArtifactBuild: ./util/after-sign.js
electronVersion: 42.0.1
