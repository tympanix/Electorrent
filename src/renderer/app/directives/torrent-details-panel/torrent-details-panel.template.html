<div
    class="torrent-details-panel"
    data-role="torrent-details-panel"
    *ngIf="isOpen"
    [style.height.px]="panelHeight"
>
    <div class="torrent-details-panel-resizer" (mousedown)="startResizing($event)"></div>
    <div class="ui top attached tabular menu torrent-details-tabs">
        <a
            class="item"
            data-role="torrent-details-tab-info"
            [class.active]="isActiveTab('info')"
            (click)="showTab('info')"
        >
            <i class="small info circle icon" aria-hidden="true"></i>
            Info
        </a>
        <a
            class="item"
            data-role="torrent-details-tab-files"
            [class.active]="isActiveTab('files')"
            (click)="showTab('files')"
        >
            <i class="small file alternate icon" aria-hidden="true"></i>
            Files
        </a>
        <a
            class="item"
            data-role="torrent-details-tab-peers"
            *ngIf="canShowPeers()"
            [class.active]="isActiveTab('peers')"
            (click)="showTab('peers')"
        >
            <i class="small users icon" aria-hidden="true"></i>
            Peers
        </a>
        <a
            class="item"
            data-role="torrent-details-tab-trackers"
            *ngIf="canShowTrackers()"
            [class.active]="isActiveTab('trackers')"
            (click)="showTab('trackers')"
        >
            <i class="small bullseye icon" aria-hidden="true"></i>
            Trackers
        </a>
        <div class="right menu">
            <a
                class="item"
                data-role="torrent-details-close"
                aria-label="Close torrent details"
                (click)="close()"
            >
                <i class="close icon"></i>
            </a>
        </div>
    </div>

    <div class="torrent-details-panel-body">
        <div *ngIf="!torrent" class="torrent-details-state torrent-details-message" data-role="torrent-details-message">
            <div class="torrent-details-state-content">
                <i class="big info circle icon"></i>
                <p>Select a torrent to view its details.</p>
            </div>
        </div>

        <torrent-details-info-tab
            *ngIf="torrent && isActiveTab('info')"
            [torrent]="torrent"
            [refresh]="refresh"
        ></torrent-details-info-tab>

        <torrent-details-files-tab
            *ngIf="torrent && isActiveTab('files')"
            [torrent]="torrent"
            [refresh]="refresh"
        ></torrent-details-files-tab>

        <torrent-details-peers-tab
            *ngIf="torrent && canShowPeers() && isActiveTab('peers')"
            [torrent]="torrent"
            [refresh]="refresh"
        ></torrent-details-peers-tab>

        <torrent-details-trackers-tab
            *ngIf="torrent && canShowTrackers() && isActiveTab('trackers')"
            [torrent]="torrent"
            [refresh]="refresh"
        ></torrent-details-trackers-tab>
    </div>
</div>
