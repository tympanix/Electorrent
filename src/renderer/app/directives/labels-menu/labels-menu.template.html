<dropdown
    data-role="labels"
    class="ui icon top left pointing dropdown button"
    [dropdownNoBlur]="true"
    [disabled]="enabled">
    <i class="tag icon"></i>
    <div class="menu">
        <div class="ui icon input">
            <i class="search icon"></i>
            <input type="text" placeholder="Search labels..." [(ngModel)]="labelSearch">
        </div>
        <div data-role="remove-label" class="item" (click)="selectLabel('')">
            <i class="remove icon"></i> Remove Label
        </div>
        <div data-role="new-label" class="item" (click)="openNewLabelModal()">
            <i class="edit icon"></i> New Label
        </div>
        <div class="divider"></div>
        <div class="scrolling menu">
            <div
                class="item label-dropdown-option"
                data-role="label-option"
                *ngFor="let label of filteredLabels; trackBy: trackLabel"
                [attr.data-label]="label"
                (click)="selectLabel(label)">
                <span class="label-dropdown-chip" [labelChip]="label">
                    <span class="label-chip-text">{{ label }}</span>
                </span>
            </div>
            <div></div>
        </div>
        <div class="message" *ngIf="labelSearch && filteredLabels.length === 0">No results found</div>
    </div>
</dropdown>

<new-label-modal [data]="form" [approve]="approveNewLabel"></new-label-modal>
