<div #modal id="setLabelModal" class="ui tiny modal">
    <div class="header">
        <i class="tag icon"></i>
        Set Label
    </div>
    <div class="content">
        <form
            id="set-label-form"
            class="ui form"
            (ngSubmit)="apply()"
            (keydown)="submitOnEnter($event)">
            <div class="field">
                <label for="set-label-dropdown">Label</label>
                <dropdown
                    id="set-label-dropdown"
                    title="Select label"
                    class="fluid"
                    [openOnFocus]="false"
                    [(ngModel)]="label"
                    name="label">
                    <dropdown-item *ngFor="let option of labels" [title]="option" [value]="option">
                        <span class="set-label-dropdown-chip" [labelChip]="option">
                            <span class="label-chip-text">{{ option }}</span>
                        </span>
                    </dropdown-item>
                </dropdown>
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="ui black deny button">Cancel</button>
        <button
            type="submit"
            form="set-label-form"
            class="ui green right labeled icon button"
            [disabled]="!label">
            Apply Label
            <i class="tag icon"></i>
        </button>
    </div>
</div>
