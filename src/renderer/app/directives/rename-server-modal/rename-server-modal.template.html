<modal
    #modal="modal"
    size="small"
    [approve]="approve"
    id="renameModal"
>
    <i class="close icon"></i>
    <div class="header">
        Rename Server
    </div>
    <div class="content">
        <form id="rename-server-form" class="ui form" (submit)="$event.preventDefault(); modal.applyAndClose()">
            <div class="field">
                <div class="ui fluid left icon action input">
                    <i class="user icon"></i>
                    <input
                        type="text"
                        name="servername"
                        maxlength="36"
                        [(ngModel)]="data.name"
                        placeholder="Server Name"
                    >
                    <button type="button" class="ui icon button" (click)="data.reset()">
                        <i class="refresh icon"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="ui black deny button">
            Cancel
        </button>
        <button
            type="submit"
            form="rename-server-form"
            class="ui green right labeled icon button"
            [class.disabled]="!data.name"
            [disabled]="!data.name"
        >
            Rename
            <i class="tag icon"></i>
        </button>
    </div>
</modal>
