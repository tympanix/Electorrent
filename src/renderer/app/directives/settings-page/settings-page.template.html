<div id="page-settings" class="wrapper">
    <div class="ui stretched segment">
        <div class="settings sidebar">
            <ul class="nav">
                <li data-role="settings-tab-general" [class.active]="activeOn('general')" (click)="gotoPage('general')">
                    <i class="large settings icon"></i>
                    General Settings
                </li>
                <li data-role="settings-tab-connection" [class.active]="activeOn('connection')" (click)="gotoPage('connection')">
                    <i class="large sitemap icon"></i>
                    Connection
                </li>
                <li data-role="settings-tab-layout" [class.active]="activeOn('layout')" (click)="gotoPage('layout')">
                    <i class="large list layout icon"></i>
                    Layout
                </li>
                <li data-role="settings-tab-servers" [class.active]="activeOn('servers')" (click)="gotoPage('servers')">
                    <i class="large server icon"></i>
                    Servers
                </li>
                <li data-role="settings-tab-advanced" [class.active]="activeOn('advanced')" (click)="gotoPage('advanced')">
                    <i class="large lab icon"></i>
                    Advanced
                </li>
                <li data-role="settings-tab-about" [class.active]="activeOn('about')" (click)="gotoPage('about')">
                    <i class="large at icon"></i>
                    About
                </li>
            </ul>
        </div>
        <div class="container">
            <div class="content">
                <div *ngIf="page === 'general'" id="page-settings-general">
                    <settings-general
                        [settings]="settings"
                        [themes]="themes"
                        [platform]="platform"
                        [general]="general"
                    ></settings-general>
                </div>

                <div *ngIf="page === 'connection'" id="page-settings-connection">
                    <settings-connection
                        *ngIf="server"
                        [server]="server"
                        [btclients]="btclients"
                        [connecting]="connecting"
                    ></settings-connection>
                </div>

                <div *ngIf="page === 'layout'" id="page-settings-layout">
                    <settings-layout
                        *ngIf="server"
                        [server]="server"
                        [sortOptions]="layoutSortOptions"
                    ></settings-layout>
                </div>

                <div *ngIf="page === 'servers'" id="page-settings-servers">
                    <settings-servers
                        [settings]="settings"
                        [renameData]="renameData"
                        (toggleDefaultServer)="toggleDefaultServer($any($event))"
                        (moveServerUp)="moveServerUp($any($event))"
                        (disableInsecureTls)="disableInsecureTls($any($event))"
                        (removeServer)="removeServer($any($event))"
                        (renameServer)="renameServer()"
                    ></settings-servers>
                </div>

                <div *ngIf="page === 'advanced'" id="page-settings-advanced">
                    <settings-advanced
                        [settings]="settings"
                        [server]="server"
                    ></settings-advanced>
                </div>

                <div *ngIf="page === 'about'" id="page-settings-about">
                    <settings-about
                        [appVersion]="appVersion"
                        [nodeVersion]="nodeVersion"
                        [chromeVersion]="chromeVersion"
                        [electronVersion]="electronVersion"
                    ></settings-about>
                </div>
            </div>
            <div class="actions footer">
                <a class="ui deny right labeled icon button" (click)="close()">
                    Cancel
                    <i class="cancel icon"></i>
                </a>
                <a class="ui positive right labeled icon button" (click)="save()">
                    Save
                    <i class="checkmark icon"></i>
                </a>
            </div>
        </div>
    </div>
</div>
