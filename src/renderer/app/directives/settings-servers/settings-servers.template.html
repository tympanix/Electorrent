<h1>Servers</h1>
<table class="ui very basic table">
    <thead>
        <tr>
            <th>Default</th>
            <th>Client</th>
            <th>Host</th>
            <th>Protocol</th>
            <th>TLS</th>
            <th>Port</th>
            <th>Username</th>
            <th class="center aligned">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let server of settings.servers; let first = first; trackBy: trackServer">
            <td class="collapsing">
                <div class="ui toggle checkbox">
                    <input
                        type="checkbox"
                        [checked]="!!server.default"
                        (change)="toggleDefaultServer(server, $any($event.target).checked)">
                    <label></label>
                </div>
            </td>
            <td>
                <span class="invalid-client-indicator" *ngIf="!server.isClientKnown()">
                    <i class="red exclamation triangle icon" [attr.title]="server.getClientWarning()"></i>
                    <span class="ui popup">{{ server.getClientWarning() }}</span>
                </span>
                {{ server.getName() }}
            </td>
            <td>{{ server.ip }}</td>
            <td class="collapsing">
                <ng-container [ngSwitch]="server.proto">
                    <div *ngSwitchCase="'http'">
                        <div class="ui label">
                            <i class="unlock alternate icon"></i> {{ server.proto }}
                        </div>
                    </div>
                    <div *ngSwitchCase="'https'">
                        <div class="ui label">
                            <i class="green lock icon"></i> {{ server.proto }}
                        </div>
                    </div>
                    <div *ngSwitchDefault>
                        <div class="ui label">
                            <i class="help icon"></i> {{ server.proto }}
                        </div>
                    </div>
                </ng-container>
            </td>
            <td class="collapsing">
                <div class="ui orange label" *ngIf="server.proto === 'https' && server.tlsSecurity === 'insecure'; else secureTls">
                    <i class="exclamation triangle icon"></i> Insecure TLS
                </div>
                <ng-template #secureTls>—</ng-template>
            </td>
            <td>{{ server.port }}</td>
            <td>{{ server.user }}</td>
            <td class="collapsing center aligned">
                <button type="button" [disabled]="first" class="circular green ui icon mini button" (click)="moveServerUp(server)">
                    <i class="icon arrow up"></i>
                </button>
                <button type="button" class="circular blue ui icon mini button" (click)="openRenameModal(server)">
                    <i class="icon tag"></i>
                </button>
                <button
                    type="button"
                    *ngIf="server.proto === 'https' && server.tlsSecurity === 'insecure'"
                    class="circular orange ui icon mini button"
                    title="Disable Insecure TLS"
                    (click)="disableInsecureTls(server)">
                    <i class="icon shield alternate"></i>
                </button>
                <button type="button" class="circular red ui icon mini button" (click)="removeServer(server)">
                    <i class="icon remove"></i>
                </button>
            </td>
        </tr>
    </tbody>
</table>

<rename-server-modal
    [data]="renameData"
    [approve]="renameServer"
    (modalRefChange)="renameModalRef = $any($event)">
</rename-server-modal>
