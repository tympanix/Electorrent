<div class="torrent-details-files" data-role="torrent-details-files">
  <div *ngIf="ctl.scope.loading && !ctl.scope.loaded" class="torrent-details-state torrent-details-panel-loader">
    <div class="ui active inline loader"></div>
  </div>
  <div *ngIf="ctl.scope.error" class="torrent-details-state torrent-details-message" data-role="torrent-details-message">
    <div class="torrent-details-state-content">
      <i class="big warning circle icon"></i>
      <p>{{ ctl.scope.error }}</p>
    </div>
  </div>
  <div class="torrent-details-files-content" *ngIf="!ctl.scope.error && (!ctl.scope.loading || ctl.scope.loaded)">
    <div class="ui tiny negative message torrent-details-files-error" *ngIf="ctl.scope.selectionError">
      {{ ctl.scope.selectionError }}
    </div>
    <table
      id="torrentDetailsFilesTable"
      data-role="torrent-details-files-table"
      class="ui compact single line unstackable fixed torrent resize table">
      <thead>
        <tr
          sorting
          [onSortChange]="ctl.changeSorting"
          [mode]="ctl.scope.resizeProfile"
          defaultSortKey="name"
          [defaultSortOrder]="false"
          sortKeyPrefix="torrent-details-files.sort-key"
          sortOrderPrefix="torrent-details-files.sort-desc">
          <th
            *ngFor="let column of ctl.scope.files.columns"
            sort-header
            [sortKey]="column.id"
            [disabled]="column.sortable === false"
            [class.torrent-details-file-selection-column]="column.id === 'wanted'">
            <div *ngIf="column.id === 'wanted'" class="ui checkbox torrent-details-file-checkbox">
              <input
                type="checkbox"
                aria-label="Select all files"
                data-role="torrent-details-files-select-all"
                [checked]="ctl.allFilesWanted()"
                [indeterminate]="ctl.allFilesSelectionIndeterminate()"
                [disabled]="!ctl.canSelectFiles() || ctl.scope.selectionUpdating"
                (click)="ctl.toggleAllFiles($event)">
              <label></label>
            </div>
            <span *ngIf="column.id !== 'wanted'" class="torrent-details-files-header-label">{{ column.label }}</span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let row of ctl.scope.sortedFiles"
          [class.torrent-details-folder-row]="row.isDirectory"
          [attr.data-file-index]="row.file?.index ?? null"
          [attr.data-file-path]="row.data.path">
          <td *ngFor="let column of ctl.scope.files.columns" [attr.data-col]="column.id">
            <div *ngIf="column.id === 'wanted'" class="torrent-details-file-cell">
              <div class="ui checkbox torrent-details-file-checkbox">
                <input
                  type="checkbox"
                  [attr.aria-label]="(row.isDirectory ? 'Select folder ' : 'Select file ') + row.data.name"
                  data-role="torrent-details-file-checkbox"
                  [checked]="ctl.rowWanted(row)"
                  [indeterminate]="ctl.rowSelectionIndeterminate(row)"
                  [disabled]="!ctl.canSelectFiles() || ctl.scope.selectionUpdating"
                  (click)="ctl.toggleRowSelection(row, $event)">
                <label></label>
              </div>
            </div>
            <div *ngIf="column.id !== 'wanted'" [ngSwitch]="column.format" class="torrent-details-file-cell">
              <div *ngSwitchCase="'progress'" class="torrent-details-file-progress">
                <div class="ui tiny indicating progress">
                  <div class="bar" [style.width.%]="ctl.fileProgressPercent(row.data)"></div>
                </div>
                <span>{{ ctl.fileProgressPercent(row.data).toFixed(1) }}%</span>
              </div>
              <div
                *ngSwitchDefault
                class="torrent-details-file-name"
                [hidden]="column.id !== 'name'"
                [style.padding-left.px]="row.depth * 18"
                [attr.title]="row.data.path"
                (click)="row.isDirectory && ctl.toggleFolder(row, $event)">
                <button
                  *ngIf="row.isDirectory"
                  type="button"
                  class="ui icon basic button torrent-details-folder-toggle"
                  [attr.aria-label]="(ctl.isFolderExpanded(row) ? 'Collapse ' : 'Expand ') + row.data.name"
                  [attr.aria-expanded]="ctl.isFolderExpanded(row)"
                  (click)="ctl.toggleFolder(row, $event)">
                  <i class="icon" [ngClass]="ctl.isFolderExpanded(row) ? 'caret down' : 'caret right'"></i>
                </button>
                <i *ngIf="!row.isDirectory" class="file outline icon torrent-details-file-icon"></i>
                <span>{{ row.data.name }}</span>
              </div>
              <span *ngSwitchDefault [hidden]="column.id === 'name'">{{ ctl.formatFileCell(column, row.data) }}</span>
            </div>
          </td>
        </tr>
        <tr *ngIf="!ctl.scope.sortedFiles.length">
          <td class="torrent-details-empty-state" [attr.colspan]="ctl.scope.files.columns.length || 1">No files available.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
