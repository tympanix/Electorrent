<div class="ui relaxed divided list upload-files-list upload-files-scroll">
    <div
        class="item upload-file-row"
        *ngFor="let node of visibleFileTree; trackBy: trackNode"
        [style.padding-left.rem]="node.level * 1.5"
        [attr.data-upload-file-path]="node.path">
        <div class="right floated content upload-file-meta">
            <span class="upload-file-size">{{ formatBytes(node.size) }}</span>
        </div>
        <div class="content">
            <div class="ui checkbox">
                <input
                    [id]="'upload-file-cb-' + node.id"
                    type="checkbox"
                    [checked]="node.selected"
                    [indeterminate]="node.partial"
                    (click)="toggleFileNode(node)">
                <label [attr.for]="'upload-file-cb-' + node.id">
                    <i class="icon" [ngClass]="node.children.length ? 'folder' : 'file outline'"></i>
                    {{ node.name }}
                </label>
            </div>
        </div>
    </div>
</div>
