<div class="torrent sidebar">
    <div class="sidebar-scroll">
        <div class="torrent-sidebar-header">
            <button
                type="button"
                class="ui icon basic mini button torrent-sidebar-toggle"
                data-role="torrent-sidebar-toggle"
                (click)="toggleCollapsed()"
                [attr.aria-label]="isCollapsed() ? 'Expand torrent sidebar' : 'Collapse torrent sidebar'"
                [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
            >
                <i class="angle double icon" [class.right]="isCollapsed()" [class.left]="!isCollapsed()"></i>
            </button>
        </div>
        <ul class="nav">
            <li data-state="all" (click)="selectStatus('all')" [class.active]="activeOn('all')">
                <i class="ui large teal asterisk icon"></i>
                <span class="torrent-sidebar-item-label">All</span>
                <div class="ui torrent sort label">{{ numInStatus('all') }}</div>
            </li>
            <li data-state="downloading" (click)="selectStatus('downloading')" [class.active]="activeOn('downloading')">
                <i class="ui large blue arrow down icon"></i>
                <span class="torrent-sidebar-item-label">Downloading</span>
                <div class="ui torrent sort label">{{ numInStatus('downloading') }}</div>
            </li>
            <li data-state="finished" (click)="selectStatus('finished')" [class.active]="activeOn('finished')">
                <i class="ui large green checkmark icon"></i>
                <span class="torrent-sidebar-item-label">Finished</span>
                <div class="ui torrent sort label">{{ numInStatus('finished') }}</div>
            </li>
            <li data-state="seeding" (click)="selectStatus('seeding')" [class.active]="activeOn('seeding')">
                <i class="ui large orange arrow up icon"></i>
                <span class="torrent-sidebar-item-label">Seeding</span>
                <div class="ui torrent sort label">{{ numInStatus('seeding') }}</div>
            </li>
            <li data-state="stopped" (click)="selectStatus('stopped')" [class.active]="activeOn('stopped')">
                <i class="ui large grey pause icon"></i>
                <span class="torrent-sidebar-item-label">Stopped</span>
                <div class="ui torrent sort label">{{ numInStatus('stopped') }}</div>
            </li>
            <li data-state="error" (click)="selectStatus('error')" [class.active]="activeOn('error')">
                <i class="ui large red remove icon"></i>
                <span class="torrent-sidebar-item-label">Failed</span>
                <div class="ui torrent sort label">{{ numInStatus('error') }}</div>
            </li>
        </ul>
        <div id="torrent-sidebar-labels" *ngIf="features.labels && !isCollapsed()">
            <torrent-sidebar-section
                title="Labels"
                clearRole="labels-clear"
                emptyText="No labels..."
                itemAttribute="label"
                [items]="labels"
                [active]="filters.label"
                [specialItemValue]="noLabelFilter"
                specialItemText="No label"
                (onSelect)="selectLabel($event)"
            ></torrent-sidebar-section>
        </div>
        <div id="torrent-sidebar-trackers" *ngIf="features.trackerFilter && !isCollapsed()">
            <torrent-sidebar-section
                title="Trackers"
                clearRole="trackers-clear"
                emptyText="No trackers..."
                itemAttribute="tracker"
                [items]="trackers"
                [active]="filters.tracker"
                (onSelect)="selectTracker($event)"
            ></torrent-sidebar-section>
        </div>
    </div>
    <div class="sidebar-collapsed-sections" *ngIf="isCollapsed()">
        <div class="sidebar-collapsed-section" *ngIf="features.labels">
            <div class="torrent-sidebar-section-trigger" data-role="torrent-sidebar-labels-toggle" title="Labels">
                <i class="tags icon"></i>
            </div>
            <div id="torrent-sidebar-labels" class="sidebar-flyout">
                <torrent-sidebar-section
                    title="Labels"
                    clearRole="labels-clear"
                    emptyText="No labels..."
                    itemAttribute="label"
                    [items]="labels"
                    [active]="filters.label"
                    [specialItemValue]="noLabelFilter"
                    specialItemText="No label"
                    (onSelect)="selectLabel($event)"
                ></torrent-sidebar-section>
            </div>
        </div>
        <div class="sidebar-collapsed-section" *ngIf="features.trackerFilter">
            <div class="torrent-sidebar-section-trigger" data-role="torrent-sidebar-trackers-toggle" title="Trackers">
                <i class="sitemap icon"></i>
            </div>
            <div id="torrent-sidebar-trackers" class="sidebar-flyout">
                <torrent-sidebar-section
                    title="Trackers"
                    clearRole="trackers-clear"
                    emptyText="No trackers..."
                    itemAttribute="tracker"
                    [items]="trackers"
                    [active]="filters.tracker"
                    (onSelect)="selectTracker($event)"
                ></torrent-sidebar-section>
            </div>
        </div>
    </div>
</div>
