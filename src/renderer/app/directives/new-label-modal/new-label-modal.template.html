<div #modal class="ui tiny modal" id="newLabelModal">
    <i class="close icon"></i>
    <div class="header">
        New Label
    </div>
    <div class="content">
        <form id="new-label-form" class="ui form" (ngSubmit)="applyAndClose()">
            <div class="field">
                <div class="ui fluid left icon input">
                    <i class="tag icon"></i>
                    <input
                        type="text"
                        name="label"
                        maxlength="36"
                        [(ngModel)]="data.label"
                        placeholder="Label Name">
                </div>
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="ui black deny button">
            Cancel
        </button>
        <button
            type="submit"
            form="new-label-form"
            class="ui green right labeled icon button"
            [class.disabled]="!data.label"
            [disabled]="!data.label">
            Apply Label
            <i class="tag icon"></i>
        </button>
    </div>
</div>
