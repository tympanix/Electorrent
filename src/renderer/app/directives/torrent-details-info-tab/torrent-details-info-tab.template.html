<div class="torrent-details-info" data-role="torrent-details-info">
  <div *ngIf="loading && !loaded" class="torrent-details-state torrent-details-panel-loader">
    <div class="ui active inline loader"></div>
  </div>
  <div *ngIf="error" class="torrent-details-state torrent-details-message" data-role="torrent-details-message">
    <div class="torrent-details-state-content">
      <i class="big warning circle icon"></i>
      <p>{{ error }}</p>
    </div>
  </div>
  <section
    *ngFor="let section of sections; trackBy: trackSection"
    class="torrent-details-section"
    [hidden]="!!error"
    [attr.aria-labelledby]="'torrent-details-section-' + section.id"
  >
    <header class="torrent-details-section-header">
      <i [class]="'icon ' + sectionIcon(section.id)" aria-hidden="true"></i>
      <h3 [id]="'torrent-details-section-' + section.id">{{ section.title }}</h3>
    </header>

    <dl class="torrent-details-field-list">
      <div
        class="torrent-details-field"
        *ngFor="let field of section.fields; trackBy: trackField"
        data-role="torrent-details-field"
        [attr.data-field-id]="field.id"
      >
        <dt>{{ field.label }}</dt>
        <dd
          [class]="'value torrent-details-field-value torrent-details-field-value-' + (field.format || 'text')"
          [class.multiline]="field.multiline"
        >
          <button
            type="button"
            class="torrent-details-field-copy"
            (click)="copyFieldValue(field)"
            [title]="fieldTitle(field) || 'Copy value'"
            [attr.aria-label]="'Copy ' + field.label + ' value'"
          >{{ formatFieldValue(field) }}</button>
        </dd>
      </div>
    </dl>
  </section>
</div>
