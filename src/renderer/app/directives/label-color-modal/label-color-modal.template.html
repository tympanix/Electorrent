<div #modal class="ui small modal" [id]="modalId">
    <i class="close icon"></i>
    <div class="header">
        Label color
    </div>
    <div class="content">
        <div class="label-color-picker-grid">
            <button
                type="button"
                class="label-color-picker-option"
                data-role="label-color-option"
                *ngFor="let hue of hues"
                [attr.data-hue]="hue"
                [attr.title]="'Hue ' + hue"
                [class.is-selected]="isSelected(hue)"
                [style.--label-hue]="getHueStyle(hue)"
                (click)="selectHue(hue)">
            </button>
        </div>
    </div>
    <div class="actions">
        <button type="button" class="ui black button" (click)="close()">
            Cancel
        </button>
        <button type="button" class="ui green right labeled icon button" data-role="label-color-save" (click)="save()">
            Save color
            <i class="checkmark icon"></i>
        </button>
    </div>
</div>
