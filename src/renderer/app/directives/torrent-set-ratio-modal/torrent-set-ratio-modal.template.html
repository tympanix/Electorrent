<modal
    #modal="modal"
    id="torrent-set-ratio-modal"
    size="tiny"
    [onHidden]="handleHidden">
    <i class="close icon"></i>
    <div class="header">
        <i class="percent icon"></i>
        Set Ratio Limit
    </div>
    <div class="content">
        <form id="torrent-set-ratio-form" class="ui form" (ngSubmit)="apply()">
            <p>Enter a ratio limit. The current limit is shown when all selected torrents share the same limit.</p>
            <div class="field">
                <label for="torrent-set-ratio-value">Ratio limit</label>
                <input
                    id="torrent-set-ratio-value"
                    data-role="torrent-set-ratio-value"
                    name="ratioLimit"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="Ratio limit"
                    [(ngModel)]="ratioLimit">
            </div>
            <div class="ui negative message" *ngIf="error">
                <p>{{ error }}</p>
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="ui black deny button" [class.disabled]="loading" [disabled]="loading" (click)="close()">
            Cancel
        </button>
        <button
            type="submit"
            form="torrent-set-ratio-form"
            class="ui green right labeled icon button"
            data-role="torrent-set-ratio-apply"
            [class.disabled]="loading"
            [disabled]="loading">
            Apply
            <i class="checkmark icon"></i>
        </button>
    </div>
</modal>
