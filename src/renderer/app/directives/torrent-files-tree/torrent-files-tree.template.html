<div class="torrent-files-tree">
    <div class="ui small buttons" style="margin-bottom: 0.5rem;">
        <button type="button" class="ui button" (click)="selectAll()">Select all</button>
        <button type="button" class="ui button" (click)="selectNone()">Deselect all</button>
        <button type="button" class="ui button" (click)="invertSelection()">Invert</button>
    </div>
    <div class="ui list" style="max-height: 320px; overflow-y: auto;">
        <div
            class="item"
            *ngFor="let row of visibleRows"
            [style.padding-left.px]="row.depth * 16 + 8"
            style="display: flex; align-items: center; gap: 6px;"
        >
            <span
                *ngIf="row.isDirectory"
                class="expand-icon"
                (click)="toggleExpanded(row.path)"
                style="cursor: pointer; flex-shrink: 0; width: 20px; text-align: center;"
                [title]="isExpanded(row.path) ? 'Collapse' : 'Expand'"
            >
                <i class="ui icon chevron right" *ngIf="!isExpanded(row.path)"></i>
                <i class="ui icon chevron down" *ngIf="isExpanded(row.path)"></i>
            </span>
            <span *ngIf="!row.isDirectory" style="width: 20px; flex-shrink: 0;"></span>
            <div class="ui checkbox" *ngIf="row.isDirectory" (click)="$event.stopPropagation()">
                <input
                    type="checkbox"
                    [checked]="getFolderWanted(row)"
                    [indeterminateValue]="getFolderIndeterminate(row)"
                    (change)="setFolderWanted(row, $any($event.target).checked)"
                    [id]="'folder-cb-' + row.path"
                >
                <label [attr.for]="'folder-cb-' + row.path"></label>
            </div>
            <div class="ui checkbox" *ngIf="row.file as file" (click)="$event.stopPropagation()">
                <input
                    type="checkbox"
                    [checked]="file.wanted"
                    (change)="setFileWanted(file, $any($event.target).checked)"
                    [id]="'file-cb-' + file.index"
                >
                <label [attr.for]="'file-cb-' + file.index"></label>
            </div>
            <span
                class="content"
                style="flex: 1; word-break: break-all; min-width: 0;"
                [title]="row.path"
                (click)="row.isDirectory && toggleExpanded(row.path)"
                [style.cursor]="row.isDirectory ? 'pointer' : null"
            >{{ row.name }}</span>
            <span class="meta" style="flex-shrink: 0;">{{ formatBytes(row.size) }}</span>
        </div>
    </div>
</div>
