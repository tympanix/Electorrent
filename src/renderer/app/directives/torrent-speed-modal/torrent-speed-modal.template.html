<modal
    #modal="modal"
    id="setSpeedLimitModal"
    size="tiny"
    [onHidden]="handleHidden">
    <i class="close icon"></i>
    <div class="header">
        <i class="dashboard icon"></i>
        Set Speed Limits
    </div>
    <div class="content">
        <form id="torrent-speed-limit-form" class="ui form" (ngSubmit)="apply()">
            <p>Enter limits in KB/s. Leave a field blank to keep the existing limit. Use 0 for unlimited.</p>
            <div class="field">
                <label for="torrent-speed-limit-download">Download limit (KB/s)</label>
                <input
                    id="torrent-speed-limit-download"
                    data-role="torrent-speed-limit-download"
                    name="downloadSpeedLimit"
                    type="number"
                    min="0"
                    placeholder="Leave unchanged"
                    [(ngModel)]="downloadSpeedLimit">
            </div>
            <div class="field">
                <label for="torrent-speed-limit-upload">Upload limit (KB/s)</label>
                <input
                    id="torrent-speed-limit-upload"
                    data-role="torrent-speed-limit-upload"
                    name="uploadSpeedLimit"
                    type="number"
                    min="0"
                    placeholder="Leave unchanged"
                    [(ngModel)]="uploadSpeedLimit">
            </div>
            <div class="ui negative message" *ngIf="error">
                <p>{{ error }}</p>
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="ui black deny button" [class.disabled]="loading" [disabled]="loading" (click)="close()">
            Cancel
        </button>
        <button
            type="submit"
            form="torrent-speed-limit-form"
            class="ui green right labeled icon button"
            data-role="torrent-speed-limit-apply"
            [class.disabled]="loading"
            [disabled]="loading">
            Apply
            <i class="checkmark icon"></i>
        </button>
    </div>
</modal>
